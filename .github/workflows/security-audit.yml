name: Security audit

on:
  push:
  pull_request:
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test dependencies without running install scripts
        run: npm ci --ignore-scripts
      - name: Check site security configuration
        run: node scripts/check-security.mjs
      - name: Test security boundaries
        run: npm run test:security
      - name: Check dependencies for published vulnerabilities
        run: npm audit --audit-level=low
