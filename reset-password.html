<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Reset password | The LevelUp Fund</title>
  <link rel="stylesheet" href="assets/fonts/current-design.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; font-family: 'Public Sans', system-ui, sans-serif; color: #f1f4f9; background: #0b1120; }
    main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #34445d; border-radius: 1rem; background: #131d30; }
    h1 { font-size: 1.7rem; margin: .75rem 0; }
    p { line-height: 1.6; color: #c6d0df; }
    label { display: block; margin: 1.2rem 0 .5rem; font-weight: 600; }
    input { width: 100%; padding: .85rem; border: 1px solid #607089; border-radius: .6rem; color: white; background: #0b1120; font: inherit; }
    button { width: 100%; margin-top: 1.5rem; border: 0; border-radius: .6rem; padding: .9rem; background: #467bdd; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #aebcff; outline-offset: 3px; }
    a { color: #b6c9ff; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <p>The LevelUp Fund</p>
    <h1>Set a new password</h1>
    <p id="recovery-status" role="status" aria-live="polite">Checking your reset link. If this page was not opened from a reset email, request a new link from the admin login.</p>
    <form id="password-form" hidden novalidate>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" minlength="12" autocomplete="new-password" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" minlength="12" autocomplete="new-password" required>
      <p>Use at least 12 characters and a password you don’t use elsewhere.</p>
      <button type="submit">Save new password</button>
    </form>
    <p><a href="index.html">Return to the site</a></p>
  </main>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./src/supabase-config.js";

    const client = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById("password-form");
    const status = document.getElementById("recovery-status");
    let recoveryReady = false;
    let saving = false;

    // Only enable the form after Supabase validates the recovery link.
    client.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        form.hidden = false;
        status.textContent = "Your reset link is valid. Choose a new password below.";
        document.getElementById("new-password").focus();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (saving) return;
      if (!recoveryReady) {
        status.textContent = "This reset link is no longer active. Request a new link from the admin login.";
        return;
      }
      const passwordField = document.getElementById("new-password");
      const confirmationField = document.getElementById("confirm-password");
      const password = passwordField.value;
      const confirmation = confirmationField.value;
      passwordField.removeAttribute("aria-invalid");
      confirmationField.removeAttribute("aria-invalid");

      if (password.length < 12) {
        status.textContent = "Enter a new password with at least 12 characters.";
        passwordField.setAttribute("aria-invalid", "true");
        passwordField.focus();
        return;
      }
      if (password !== confirmation) {
        status.textContent = "The passwords do not match. Please try again.";
        confirmationField.setAttribute("aria-invalid", "true");
        confirmationField.focus();
        return;
      }

      const button = form.querySelector("button");
      saving = true;
      button.disabled = true;
      button.textContent = "Saving…";
      status.textContent = "Saving your new password…";
      let timeoutId;
      try {
        const timeout = new Promise((_, reject) => {
          timeoutId = setTimeout(() => reject(new Error("request-timeout")), 20000);
        });
        const { error } = await Promise.race([client.auth.updateUser({ password }), timeout]);
        if (error) throw error;
        recoveryReady = false;
        form.reset();
        form.hidden = true;
        status.textContent = "Password updated. Return to the site and sign in with your new password.";
        try { await client.auth.signOut({ scope: "local" }); } catch (error) { /* Password was already changed. */ }
      } catch (error) {
        if (error && error.message === "request-timeout") {
          status.textContent = "The request is taking too long, so we could not confirm the change. Try signing in with your new password; if that fails, request a new reset link.";
          // The request may still finish after the timeout. Avoid sending another update from this page.
          recoveryReady = false;
          form.hidden = true;
          form.reset();
        } else if (error && (error.code === "weak_password" || error.code === "same_password" || error.status === 422)) {
          status.textContent = "That password was not accepted. Try a different password with at least 12 characters.";
          passwordField.focus();
        } else {
          status.textContent = "Could not save the password. Check your connection and try again; if the link has expired, request a new one.";
        }
      } finally {
        clearTimeout(timeoutId);
        saving = false;
        button.disabled = false;
        button.textContent = "Save new password";
      }
    });
  </script>
</body>
</html>
